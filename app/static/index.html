<!DOCTYPE html>

<html lang="zh-CN">
<head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>豆瓣映单 · Douban Reel</title><link href="/static/style.css" rel="stylesheet"/><script defer="" src="/static/app.js"></script></head>
<body>
<header><a class="brand" href="/"><span class="logo">映</span><span>豆瓣映单</span></a><div class="nav-actions"><div class="nav-save"><span aria-live="polite" class="help" id="dirty"></span><button class="primary" form="settingsForm" id="saveConfig" type="submit">保存配置</button></div></div></header>
<main>
<section class="hero"><div><h1>同步</h1></div><div class="hero-actions"><button class="secondary" id="preview">预览同步</button><button class="primary" id="sync">立即同步 <span>↗</span></button><button class="danger" hidden="" id="stop">停止任务</button></div></section>
<div aria-live="polite" class="notice" hidden="" id="notice" role="status"></div>
<section aria-label="同步概况" class="stats"><article><span>调度状态</span><strong id="schedulerState">读取中</strong><small id="nextRun">—</small></article><article><span>已提交请求</span><strong id="submitted">0</strong></article><article><span>Seerr 已存在</span><strong id="existing">0</strong></article><article><span>需要处理</span><strong id="failed">0</strong></article></section>
<div class="workspace">
<div class="settings">
<section class="card"><div class="section-heading"><div><h2>豆瓣账号</h2></div><span class="badge" id="cookieStatus">未配置</span></div>
<label for="douban_user">豆瓣用户（可选）</label><input autocomplete="off" id="douban_user" placeholder="留空使用 Cookie 账号，或填写 ID / 个人主页"/>
<label for="cookie">豆瓣 Cookie</label><textarea autocomplete="off" id="cookie" placeholder="Cookie 请求头或 JSON" rows="4" spellcheck="false"></textarea>
<div class="button-row"><button class="primary small" id="saveCookie">验证并保存</button><button class="secondary small" id="testCookie">验证 Cookie</button><button class="text-button" id="deleteCookie">删除</button></div>
<p class="help" hidden="" id="cookieHealth"></p>
<details><summary>获取 Cookie</summary><p>登录豆瓣电影，在浏览器开发者工具的网络面板中复制页面请求的 Cookie（含 dbcl2 和 ck）。</p></details>
</section>
<form id="settingsForm">
<section class="card"><div class="section-heading"><div><h2>媒体服务</h2></div></div>
<label for="seerr_url">Seerr 地址</label><input id="seerr_url" placeholder="http://192.168.1.100:5055" type="url"/>
<label for="seerr_api_key">Seerr API Key <span class="saved" id="seerrSaved"></span></label><input autocomplete="new-password" id="seerr_api_key" placeholder="设置 → 通用 → API Key" type="password"/>

<div class="button-row"><button class="secondary small" id="testSeerr" type="button">测试 Seerr</button></div>
</section>
<section class="card"><div class="section-heading"><div><h2>同步规则</h2></div></div>
<div class="media-toggles"><label class="toggle-card"><span><b>电影</b></span><input checked="" id="movies" role="switch" type="checkbox"/></label><label class="toggle-card"><span><b>电视剧</b></span><input checked="" id="tv" role="switch" type="checkbox"/></label></div>
<div class="fields"><div><label for="history_days">历史范围 · 天</label><input id="history_days" max="36500" min="1" required="" type="number" value="30"/></div><div><label for="interval_minutes">同步间隔 · 分钟</label><input id="interval_minutes" max="10080" min="15" required="" type="number" value="1440"/></div></div>
<div class="fields"><div><label for="request_delay">随机间隔上限 · 秒</label><input id="request_delay" max="60" min="2" required="" step="0.5" type="number" value="15"/></div><div><label for="tv_seasons">无明确季号时</label><select id="tv_seasons"><option value="first">只请求第一季</option><option value="all">请求当前全部普通季</option></select></div></div>
<label class="schedule-toggle"><span><b>开启定时同步</b></span><input id="enabled" role="switch" type="checkbox"/></label>

</section>
<section class="card"><div class="section-heading"><div><h2>Cookie 失效通知</h2></div></div>
<label for="bark_url">Bark 推送地址 <span class="saved" id="barkSaved"></span></label><input autocomplete="new-password" id="bark_url" placeholder="https://api.day.app/设备密钥" type="password"/>
<div class="button-row"><button class="secondary small" id="testBark" type="button">测试 Bark</button><button class="text-button" id="deleteBark" type="button">删除</button></div><p class="help" hidden="" id="notificationHealth"></p>
</section></form>
</div>
<aside>
<section class="card"><div class="section-heading"><div><h2>最近运行</h2></div><span class="badge" id="runningBadge">空闲</span></div><div class="run-list" id="runs"><p class="empty">暂无任务</p></div></section>
</aside>
</div>
<section class="card records"><div class="section-heading"><div><h2>同步记录</h2></div><label class="filter-label">状态筛选<select id="filter"><option value="">全部状态</option><option value="submitted">已提交</option><option value="existing">已存在</option><option value="failed">需要处理</option><option value="preview">预览</option><option value="disabled">类型已关闭</option><option value="mapped">已映射</option></select></label></div><div class="table-scroll"><table><thead><tr><th>豆瓣条目</th><th>想看日期</th><th>类型 / TMDB</th><th>状态</th><th>说明</th><th>操作</th></tr></thead><tbody id="items"><tr><td class="empty" colspan="6">暂无记录</td></tr></tbody></table></div></section>

</main>
<dialog id="mappingDialog"><form id="mappingForm"><h2>手动指定 TMDB 映射</h2><p class="muted" id="mappingTitle"></p><input id="mappingSubject" type="hidden"/><label for="mappingType">媒体类型</label><select id="mappingType"><option value="movie">电影</option><option value="tv">电视剧</option></select><label for="mappingId">TMDB ID</label><input id="mappingId" min="1" required="" type="number"/><label for="mappingSeason">季号（电视剧可填）</label><input id="mappingSeason" max="999" min="1" placeholder="可选" type="number"/><div class="button-row"><button class="primary" type="submit">保存映射</button><button class="secondary" id="cancelMapping" type="button">取消</button></div></form></dialog>
</body></html>
